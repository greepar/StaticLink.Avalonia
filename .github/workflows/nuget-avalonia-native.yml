name: staticlink-avalonia-native

on:
  workflow_dispatch:
    inputs:
      avalonia_version:
        description: Avalonia version to build; empty checks the latest stable 11.x and 12.x versions
        required: false
        type: string
      force_build:
        description: Build even when this StaticLink.Avalonia.Native version already exists
        required: true
        default: false
        type: boolean
      publish_to_nuget:
        description: Publish with NuGet Trusted Publishing after smoke tests
        required: true
        default: false
        type: boolean

# Keep this workflow registered on the default branch for branch dispatch.
# The complete build and publication implementation lives on the release branches.
permissions:
  contents: read

jobs:
  select-release-branch:
    runs-on: ubuntu-24.04
    steps:
      - name: Select the branch containing the build implementation
        run: |
          echo "::error::Select avalonia-native in Run workflow > Branch. main contains documentation and daily dispatchers only."
          exit 1
