name: osx-native-daily

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      force_build:
        description: Rebuild even if the package is already published on NuGet
        type: boolean
        default: false

permissions:
  contents: read
  actions: write

concurrency:
  group: osx-native-daily
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        major: [11, 12]
    steps:
      - name: Check latest stable Avalonia and dispatch Native build
        env:
          GH_TOKEN: ${{ github.token }}
          AVALONIA_MAJOR: ${{ matrix.major }}
          FORCE_BUILD: ${{ inputs.force_build }}
          NATIVE_BRANCH: avalonia-native
          PACKAGE_REVISION: '2'
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import subprocess

          repository = os.environ['GITHUB_REPOSITORY']
          branch = os.environ['NATIVE_BRANCH']
          major = int(os.environ['AVALONIA_MAJOR'])

          def summary(message):
              print(message, flush=True)
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as output:
                  output.write(message + '\n')

          upstream = json.loads(subprocess.check_output([
              'curl', '--fail', '--silent', '--show-error', '--location', '--retry', '3',
              'https://api.nuget.org/v3-flatcontainer/avalonia/index.json',
          ], text=True))
          candidates = [version for version in upstream['versions']
                        if re.fullmatch(r'\d+\.\d+\.\d+', version)
                        and int(version.split('.')[0]) == major]
          if not candidates:
              raise SystemExit(f'No stable Avalonia {major} version found')
          version = max(candidates, key=lambda value: tuple(map(int, value.split('.'))))
          package_version = version + '.' + os.environ['PACKAGE_REVISION']
          published = json.loads(subprocess.check_output([
              'curl', '--fail', '--silent', '--show-error', '--location', '--retry', '3',
              'https://api.nuget.org/v3-flatcontainer/staticlink.avalonia.native/index.json',
          ], text=True))['versions']
          if os.environ['FORCE_BUILD'] != 'true' and package_version in published:
              summary(f'Already published on NuGet: {package_version}')
              raise SystemExit(0)

          payload = json.dumps({'ref': branch, 'inputs': {
              'avalonia_version': version, 'force_build': True, 'publish_to_nuget': True,
          }})
          subprocess.run([
              'gh', 'api', '--method', 'POST',
              f'repos/{repository}/actions/workflows/nuget-avalonia-native.yml/dispatches',
              '--input', '-',
          ], input=payload, text=True, check=True)
          summary(f'Dispatched {package_version} on {branch}; NuGet publication enabled after smoke tests.')
          PY
