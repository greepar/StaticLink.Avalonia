name: skiasharp-daily

on:
  schedule:
    - cron: '20 2 * * *' # Daily at 10:20 Asia/Singapore
  workflow_dispatch:
    inputs:
      publish_to_nuget:
        description: Publish preview packages after every platform runtime test succeeds
        type: boolean
        default: false

permissions:
  contents: read
  actions: write

concurrency:
  group: skiasharp-daily
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        branch: [skia3-daily, skia4-daily]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Check upstream version and dispatch only when needed
        env:
          GH_TOKEN: ${{ github.token }}
          DAILY_BRANCH: ${{ matrix.branch }}
          PUBLISH_TO_NUGET: ${{ github.event_name == 'schedule' || inputs.publish_to_nuget == true }}
        run: |
          python3 scripts/dispatch-skia-daily.py --branch "$DAILY_BRANCH" --publish-to-nuget "$PUBLISH_TO_NUGET"
      - name: Upload version decision
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: daily-plan-${{ matrix.branch }}
          path: daily-plan.json
          if-no-files-found: error
