name: daily-native-release

on:
  schedule:
    - cron: '20 2 * * *' # Daily at 10:20 Asia/Singapore
  workflow_dispatch:
    inputs:
      publish_to_nuget:
        description: Publish candidates after every platform runtime test succeeds
        type: boolean
        default: false

permissions:
  contents: read
  actions: write

concurrency:
  group: daily-native-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        major: ['11', '12']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Resolve official release and dispatch complete validation
        env:
          GH_TOKEN: ${{ github.token }}
          AVALONIA_MAJOR: ${{ matrix.major }}
          RELEASE_REF: ${{ github.ref_name }}
          PUBLISH_TO_NUGET: ${{ github.event_name == 'schedule' || inputs.publish_to_nuget == true }}
        run: |
          set -euo pipefail
          python3 scripts/check-avalonia-releases.py --major "$AVALONIA_MAJOR"
          python3 - <<'PY'
          import json, os, subprocess
          plan = json.load(open('release-plan.json'))
          payload = {'ref': os.environ['RELEASE_REF'], 'inputs': {
              'avalonia_version': plan['avalonia_version'],
              'publish_to_nuget': os.environ['PUBLISH_TO_NUGET'] == 'true',
              'publish_to_release': False,
          }}
          subprocess.run(['gh', 'api', '--method', 'POST',
                          'repos/' + os.environ['GITHUB_REPOSITORY'] + '/actions/workflows/nuget-static-graphics.yml/dispatches',
                          '--input', '-'], input=json.dumps(payload), text=True, check=True)
          print('Dispatched complete runtime validation for ' + plan['package_version'])
          PY
      - name: Upload daily release plan
        if: ${{ always() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: daily-release-plan-${{ matrix.major }}
          path: release-plan.json
          if-no-files-found: warn
