name: skiasharp-daily

on:
  schedule:
    - cron: '20 2 * * *' # Daily at 10:20 Asia/Singapore
  workflow_dispatch:
    inputs:
      publish_to_nuget:
        description: Publish preview packages after every platform runtime test succeeds
        type: boolean
        default: false

permissions:
  contents: read
  actions: write

concurrency:
  group: skiasharp-daily
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        branch: [skia3-daily, skia4-daily]
    steps:
      - name: Dispatch complete build and runtime validation
        env:
          GH_TOKEN: ${{ github.token }}
          DAILY_BRANCH: ${{ matrix.branch }}
          PUBLISH_TO_NUGET: ${{ github.event_name == 'schedule' || inputs.publish_to_nuget == true }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, subprocess
          branch = os.environ['DAILY_BRANCH']
          if branch not in ('skia3-daily', 'skia4-daily'):
              raise SystemExit('Unexpected daily branch')
          payload = {'ref': branch, 'inputs': {
              'avalonia_version': '12.1.4',
              'publish_to_nuget': os.environ['PUBLISH_TO_NUGET'] == 'true',
              'publish_to_release': False,
          }}
          subprocess.run(['gh', 'api', '--method', 'POST',
                          'repos/' + os.environ['GITHUB_REPOSITORY'] + '/actions/workflows/nuget-static-graphics.yml/dispatches',
                          '--input', '-'], input=json.dumps(payload), text=True, check=True)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as output:
              output.write(f'Dispatched {branch}: nine Zig targets, Avalonia runtime smoke and required Metal checks before preview publication.\n')
          PY
