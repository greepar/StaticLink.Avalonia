name: staticlink-avalonia

on:
  workflow_dispatch:
    inputs:
      avalonia_version:
        description: Avalonia runtime baseline for this SkiaSharp daily branch
        type: string
        default: '12.1.4'
      toolchain_image:
        description: Immutable Zig toolchain image used by local and CI validation
        type: string
        default: 'ghcr.io/greepar/staticlink.avalonia-zig@sha256:e54b069aed7c880ea09e416886f8759df75eb283ca923dcfa37321fa3e6e9bfe'
      validated_run_id:
        description: Publish this completed daily validation artifact without rebuilding
        type: string
        default: ''
      environment_only:
        description: Validate the complete toolchain container without building release libraries
        type: boolean
        default: false
      skiasharp_version:
        description: Published stable SkiaSharp version in this daily major; empty selects latest
        type: string
        default: ''
      angle_version:
        description: Official ANGLE package version; empty selects most recently published stable release
        type: string
        default: ''
      native_package_revision:
        description: Published AvaloniaNative revision for independent graphics smoke tests
        type: string
        default: '1'
      publish_to_nuget:
        description: Publish package to nuget.org
        required: true
        default: false
        type: boolean
      publish_to_release:
        description: Publish NuGet package and smoke apps to GitHub Release
        required: true
        default: false
        type: boolean
# Keep this workflow registered on the default branch for branch dispatch.
# The complete build and publication implementation lives on the release branches.
permissions:
  contents: read

jobs:
  select-release-branch:
    runs-on: ubuntu-24.04
    steps:
      - name: Select the branch containing the build implementation
        run: |
          echo "::error::Select skia2, skia3, skia3-daily or skia4-daily in Run workflow > Branch. main contains documentation and daily dispatchers only."
          exit 1
